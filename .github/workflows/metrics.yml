name: Metrics
on:
  # rebuild the dashboard daily, on demand, and on push
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics dashboard
        uses: lowlighter/metrics@latest
        with:
          # A GitHub Personal Access Token you create (classic; scopes: repo, read:org, read:user).
          # Add it as a repo secret named METRICS_TOKEN — see the setup note in the README.
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Istanbul

          # Isometric contributions calendar (the 3D one)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Most used languages
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Coding habits (commit-time-of-day, facts)
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_from: 200

          # Lines of code changed & achievements
          plugin_lines: yes
          plugin_achievements: yes
          plugin_achievements_threshold: C

          # Recent activity
          plugin_activity: yes
          plugin_activity_limit: 5
